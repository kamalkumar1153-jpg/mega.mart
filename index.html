<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MegaMart - Online Shopping</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <style>
        :root {
            --amazon-blue: #131921;
            --amazon-light: #232f3e;
            --amazon-yellow: #f0c14b;
            --bg-color: #eaeded;
            --text-main: #0f1111;
            --price-red: #b12704;
        }

        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-main); }

        .navbar { background-color: var(--amazon-blue); color: white; padding: 10px 20px; display: flex; flex-direction: column; gap: 10px; position: sticky; top: 0; z-index: 100; }
        .nav-top { display: flex; justify-content: space-between; align-items: center; }
        .brand { font-size: 22px; font-weight: bold; color: white; text-decoration: none; }
        .brand span { color: var(--amazon-yellow); }
        
        .search-container { display: flex; width: 100%; }
        .search-container input { flex: 1; padding: 10px; border: none; border-radius: 4px 0 0 4px; outline: none; }
        .search-container button { background: var(--amazon-yellow); border: none; padding: 10px 15px; border-radius: 0 4px 4px 0; cursor: pointer; font-weight: bold; }

        .categories-bar { background-color: var(--amazon-light); display: flex; gap: 15px; padding: 8px 20px; overflow-x: auto; white-space: nowrap; }
        .cat-tab { color: white; cursor: pointer; font-size: 14px; padding: 4px 8px; border-radius: 3px; transition: 0.2s; }
        .cat-tab:hover, .cat-tab.active { background-color: rgba(255,255,255,0.2); color: var(--amazon-yellow); }

        .flash-banner { background: #232f3e; color: #fff; padding: 12px; text-align: center; font-weight: bold; font-size: 14px; border-bottom: 3px solid var(--amazon-yellow); display: none; }

        .main-container { max-width: 1200px; margin: 20px auto; padding: 0 15px; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }

        .product-card { background: white; border-radius: 4px; padding: 15px; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid #ddd; }
        .badge { background: #cc0c39; color: white; font-size: 11px; padding: 3px 6px; }
        .product-img { width: 100%; height: 150px; object-fit: contain; margin-bottom: 10px; }
        .product-title { font-size: 14px; height: 38px; overflow: hidden; margin: 5px 0; }
        .final-price { color: var(--price-red); font-size: 18px; font-weight: bold; }
        .mrp-price { text-decoration: line-through; color: #565959; font-size: 12px; }
        
        .buy-btn { background: var(--amazon-yellow); border: 1px solid #a88734; padding: 8px; width: 100%; cursor: pointer; font-weight: bold; margin-top: 10px; }
        
        @media (max-width: 600px) { .products-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; } }
    </style>
</head>
<body>

<div class="navbar">
    <div class="nav-top">
        <a href="#" class="brand">Mega<span>Mart</span></a>
        <div>🇮🇳 Hub</div>
    </div>
    <div class="search-container">
        <input type="text" id="searchInput" oninput="renderProducts()" placeholder="Search products...">
        <button>🔍</button>
    </div>
</div>

<div class="categories-bar">
    <div class="cat-tab active" id="cat-all" onclick="filterCategory('All')">All</div>
    <div class="cat-tab" id="cat-Electronics" onclick="filterCategory('Electronics')">Electronics</div>
    <div class="cat-tab" id="cat-Fashion" onclick="filterCategory('Fashion')">Fashion</div>
</div>

<div class="flash-banner" id="liveFlashBanner"></div>

<div class="main-container">
    <div class="products-grid" id="showroomGrid">Loading...</div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCuhd6WeneZFqkScgyVv2-8k5_xZz5N5o",
        databaseURL: "https://sanitarymart-65014-default-rtdb.firebaseio.com/",
        projectId: "sanitarymart-65014",
        appId: "1:285578370716:web:c47f43f25ad2ab86b25759"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let allProducts = [];
    let currentCategory = 'All';

    database.ref('ecommerce_products').on('value', (snap) => {
        allProducts = [];
        snap.forEach((child) => { allProducts.push({...child.val(), id: child.key}); });
        renderProducts();
    });

    function renderProducts() {
        const grid = document.getElementById('showroomGrid');
        grid.innerHTML = "";
        let filtered = currentCategory === 'All' ? allProducts : allProducts.filter(p => p.category === currentCategory);
        const search = document.getElementById('searchInput').value.toLowerCase();
        filtered = filtered.filter(p => p.title.toLowerCase().includes(search));

        filtered.forEach(p => {
            let finalPrice = Math.round(p.price - (p.price * p.discount / 100));
            grid.innerHTML += `
                <div class="product-card">
                    <span class="badge">${p.discount}% OFF</span>
                    <img src="${p.image}" class="product-img">
                    <h4 class="product-title">${p.title}</h4>
                    <div>
                        <span class="final-price">₹${finalPrice}</span>
                        <span class="mrp-price">₹${p.price}</span>
                    </div>
                    <button class="buy-btn" onclick="orderNow('${p.title}', ${finalPrice})">Pay & Buy Now</button>
                </div>
            `;
        });
    }

    function orderNow(itemName, price) {
        // आपका UPI ID अपडेटेड है
        const upiID = "9024686665@ybl"; 
        const upiUrl = `upi://pay?pa=${upiID}&pn=MegaMart&am=${price}&cu=INR&tn=Payment_for_${encodeURIComponent(itemName)}`;

        if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
            window.location.href = upiUrl;
        } else {
            alert(`कृपया पेमेंट के लिए इस UPI ID का उपयोग करें:\n\nUPI ID: ${upiID}\nAmount: ₹${price}`);
        }
    }

    function filterCategory(cat) {
        currentCategory = cat;
        document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
        document.getElementById(`cat-${cat === 'All' ? 'all' : cat}`).classList.add('active');
        renderProducts();
    }
</script>
</body>
</html>
